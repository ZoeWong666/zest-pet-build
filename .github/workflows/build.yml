name: Build Windows EXE
on:
  push:
    paths-ignore:
      - 'Zest.exe'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyqt6 pillow pyinstaller
      - run: pyinstaller --onefile --windowed --add-data "final/spritesheet-extended.webp;final" --add-data "decoded;decoded" --add-data "references;references" --name Zest zest_pet_qt.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zest-Windows
          path: dist/Zest.exe

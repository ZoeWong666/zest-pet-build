name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # Qt needs these system libs to start even on the offscreen platform.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3
      - run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: >
          pyinstaller --onefile --windowed --name Zest
          --icon packaging/ZestIcon.ico
          --add-data "assets;assets"
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zest-Windows
          path: dist/Zest.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: >
          pyinstaller --windowed --name Zest
          --icon packaging/ZestIcon.icns
          --add-data "assets:assets"
          --osx-bundle-identifier com.zest.pet
          main.py
      # LSUIElement keeps the pet out of the Dock and the app switcher.
      - run: |
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/Zest.app/Contents/Info.plist
      - run: ditto -c -k --keepParent dist/Zest.app Zest-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Zest-macOS
          path: Zest-macOS.zip

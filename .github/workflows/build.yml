name: Build Windows EXE
on:
  push:
    paths-ignore:
      - 'Zest.exe'
      - 'Zest.app/**'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame pillow pyinstaller
      - run: pyinstaller --onefile --windowed --add-data "final/spritesheet-extended.webp;final" --name Zest zest_pet_pygame.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zest-Windows
          path: dist/Zest.exe
